MODEL:
  TYPE: vHeat
  NAME: vHeat_base_imagenette
  NUM_CLASSES: 10  # Imagenette有10个类别
  DROP_PATH_RATE: 0.2
  VHEAT:
    EMBED_DIM: 128
    DEPTHS: [2, 2, 18, 2]
    LAYER_SCALE: 1.e-5
    POST_NORM: True

TRAIN:
  EPOCHS: 100
  BASE_LR: 5.e-4
  WARMUP_LR: 5.e-7
  MIN_LR: 5.e-6
  WARMUP_EPOCHS: 5
  WEIGHT_DECAY: 0.05

DATA:
  DATASET: imagenet
  IMG_SIZE: 224  # vHeat期望的输入尺寸
  BATCH_SIZE: 64  # 可以根据你的GPU调整
  NUM_WORKERS: 4

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: 'rand-m9-mstd0.5-inc1'

SAVE_FREQ: 10
OUTPUT: ./output_imagenette
